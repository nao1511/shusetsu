<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>終雪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0d1118; --snow:#e9edf3; --haze:#9aa6b8; --ember:#f0a36a; --line:rgba(233,237,243,.28);
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--snow);overflow:hidden;font-family:var(--gothic)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#veil{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:space-between;
  padding:max(6vh,calc(env(safe-area-inset-top,0px) + 24px)) 7vw max(6vh,calc(env(safe-area-inset-bottom,0px) + 24px));
  background:linear-gradient(90deg,rgba(13,17,24,.72),rgba(13,17,24,.12) 46%,rgba(13,17,24,0) 70%);
  transition:opacity 1.4s ease;pointer-events:none}
#veil.gone{opacity:0}
#veil>*{pointer-events:auto}
#veil.gone>*{pointer-events:none}
.left{display:flex;flex-direction:column;justify-content:flex-end;gap:1.6rem;max-width:25rem}
h1{font-family:var(--mincho);font-weight:700;font-size:clamp(4.2rem,13vh,8.5rem);line-height:1.02;margin:0;
  writing-mode:vertical-rl;letter-spacing:.14em;text-shadow:0 0 40px rgba(13,17,24,.6)}
.lead{font-family:var(--mincho);font-weight:500;font-size:1.06rem;line-height:1.95;margin:0;color:var(--snow)}
.keys{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:auto 1fr;gap:.34rem 1.1rem;font-size:.82rem;color:var(--haze)}
.keys b{font-weight:500;color:var(--snow)}
button{font:500 1rem var(--mincho);letter-spacing:.2em;color:var(--snow);background:rgba(13,17,24,.35);
  border:1px solid var(--line);padding:.95rem 2.2rem .95rem 2.4rem;cursor:pointer;align-self:flex-start;
  transition:background .25s,border-color .25s,color .25s}
button:hover{background:rgba(240,163,106,.14);border-color:var(--ember);color:#fff}
button:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
#hud{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);font-size:.78rem;color:var(--haze);
  letter-spacing:.06em;opacity:0;transition:opacity .8s;pointer-events:none;white-space:nowrap;text-shadow:0 1px 6px #000}
#hud.on{opacity:1}
#fps{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font-size:.74rem;color:var(--haze);display:none;text-align:right;white-space:pre;text-shadow:0 1px 4px #000}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:8vw;text-align:center;font-family:var(--mincho);line-height:2}
@media (max-width:640px){h1{font-size:4rem}.keys{display:none}.left{max-width:none}}
@media (prefers-reduced-motion:reduce){#veil{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil">
  <div class="left">
    <p class="lead">崩れた街に、雪だけが降りつづけている。</p>
    <ul class="keys">
      <li><b>W A S D</b></li><li>移動</li>
      <li><b>マウス</b></li><li>視点</li>
      <li><b>Q / E</b></li><li>下降 / 上昇</li>
      <li><b>Shift</b></li><li>加速</li>
      <li><b>T</b></li><li>自動飛行に戻す</li>
      <li><b>M</b></li><li>風の音を消す</li>
    </ul>
    <button id="go">街へ入る</button>
  </div>
  <h1>終雪</h1>
</div>
<div id="hud">WASD 移動　マウス 視点　Q/E 下降・上昇　Shift 加速　T 自動飛行　F 計測</div>
<div id="fps"></div>
<div id="err"></div>
<script>
'use strict';
const HEADLESS = typeof document === 'undefined';
const TAU = Math.PI * 2;

/* ───────────── 乱数とノイズ ───────────── */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function h2(x,y){let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y);let fx=x-xi,fy=y-yi;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
function fbm2(x,y){return vnoise(x,y)*.5+vnoise(x*2.03+7.1,y*2.03+3.3)*.25+vnoise(x*4.1+1.7,y*4.1+9.2)*.125+vnoise(x*8.2+4.4,y*8.2+2.6)*.0625}

/* ───────────── メッシュの組み立て ───────────── */
const STRIDE = 20;
function buildWorld(){
  const MAXV = 2600000, MAXI = 3900000;
  const ab = new ArrayBuffer(MAXV*STRIDE), f32 = new Float32Array(ab), i8 = new Int8Array(ab), u8 = new Uint8Array(ab);
  const idx = new Uint32Array(MAXI);
  let nv = 0, ni = 0;
  let cm = 0, cr = 200, cg = 200, cb = 200, ca = 0;
  const M = (m,r,g,b,a=0)=>{cm=m;cr=r;cg=g;cb=b;ca=a};
  const T = new Float64Array(12); let TON = false;
  function setRot(px,py,pz,ax,ay,az,ang){const c=Math.cos(ang),s=Math.sin(ang),t=1-c;
    T[0]=t*ax*ax+c;T[1]=t*ax*ay-s*az;T[2]=t*ax*az+s*ay;T[3]=t*ax*ay+s*az;T[4]=t*ay*ay+c;T[5]=t*ay*az-s*ax;
    T[6]=t*ax*az-s*ay;T[7]=t*ay*az+s*ax;T[8]=t*az*az+c;T[9]=px;T[10]=py;T[11]=pz;TON=true}
  const clearRot = ()=>{TON=false};
  const HP = new Float64Array(24);
  const FACES = [1,3,7,5, 0,4,6,2, 2,6,7,3, 0,1,5,4, 4,5,7,6, 0,2,3,1];
  function hexa(){
    if(nv+24>MAXV||ni+36>MAXI) return;
    if(TON) for(let i=0;i<8;i++){const x=HP[i*3]-T[9],y=HP[i*3+1]-T[10],z=HP[i*3+2]-T[11];
      HP[i*3]=T[0]*x+T[1]*y+T[2]*z+T[9];HP[i*3+1]=T[3]*x+T[4]*y+T[5]*z+T[10];HP[i*3+2]=T[6]*x+T[7]*y+T[8]*z+T[11]}
    for(let f=0;f<6;f++){
      const a=FACES[f*4]*3,b=FACES[f*4+1]*3,c=FACES[f*4+2]*3,d=FACES[f*4+3]*3;
      const e1x=HP[b]-HP[a],e1y=HP[b+1]-HP[a+1],e1z=HP[b+2]-HP[a+2],e2x=HP[c]-HP[a],e2y=HP[c+1]-HP[a+1],e2z=HP[c+2]-HP[a+2];
      let nx=e1y*e2z-e1z*e2y,ny=e1z*e2x-e1x*e2z,nz=e1x*e2y-e1y*e2x;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
      for(let k=0;k<4;k++){const p=FACES[f*4+k]*3,o=nv*5,ob=nv*STRIDE;
        f32[o]=HP[p];f32[o+1]=HP[p+1];f32[o+2]=HP[p+2];
        i8[ob+12]=Math.round(nx*127);i8[ob+13]=Math.round(ny*127);i8[ob+14]=Math.round(nz*127);i8[ob+15]=cm;
        u8[ob+16]=cr;u8[ob+17]=cg;u8[ob+18]=cb;u8[ob+19]=ca;nv++}
      idx[ni++]=nv-4;idx[ni++]=nv-3;idx[ni++]=nv-2;idx[ni++]=nv-4;idx[ni++]=nv-2;idx[ni++]=nv-1;
    }
  }
  function box(cx,cy,cz,hx,hy,hz,rx=0,ry=0,rz=0){
    let ux=1,uy=0,uz=0,vx=0,vy=1,vz=0,wx=0,wy=0,wz=1;
    if(rx||ry||rz){const cX=Math.cos(rx),sX=Math.sin(rx),cY=Math.cos(ry),sY=Math.sin(ry),cZ=Math.cos(rz),sZ=Math.sin(rz);
      ux=cY*cZ+sY*sX*sZ;uy=cX*sZ;uz=-sY*cZ+cY*sX*sZ;vx=-cY*sZ+sY*sX*cZ;vy=cX*cZ;vz=sY*sZ+cY*sX*cZ;wx=sY*cX;wy=-sX;wz=cY*cX}
    for(let i=0;i<8;i++){const a=i&1?hx:-hx,b=i&2?hy:-hy,c=i&4?hz:-hz;
      HP[i*3]=cx+ux*a+vx*b+wx*c;HP[i*3+1]=cy+uy*a+vy*b+wy*c;HP[i*3+2]=cz+uz*a+vz*b+wz*c}
    hexa();
  }
  function beam(x0,y0,z0,x1,y1,z1,r0,r1){
    let dx=x1-x0,dy=y1-y0,dz=z1-z0;const l=Math.hypot(dx,dy,dz)||1;dx/=l;dy/=l;dz/=l;
    let ux,uy,uz;if(Math.abs(dy)<0.95){ux=-dz;uy=0;uz=dx}else{ux=0;uy=dz;uz=-dy}
    const ul=Math.hypot(ux,uy,uz);ux/=ul;uy/=ul;uz/=ul;
    const vx=dy*uz-dz*uy,vy=dz*ux-dx*uz,vz=dx*uy-dy*ux;
    for(let i=0;i<8;i++){const r=i&4?r1:r0,a=i&1?r:-r,b=i&2?r:-r,px=i&4?x1:x0,py=i&4?y1:y0,pz=i&4?z1:z0;
      HP[i*3]=px+ux*a+vx*b;HP[i*3+1]=py+uy*a+vy*b;HP[i*3+2]=pz+uz*a+vz*b}
    hexa();
  }

  /* ── 街の区割り ── */
  const P = 46, mounds = [], specs = [], parks = [], lots = [], lights = [];
  const mkSpec=(cx,cz,w,d,floors,seed,R,o={})=>Object.assign({cx,cz,w,d,floors,seed,ang:R()*TAU,intact:R()<0.2,topF:0.45+0.6*R(),slope:0.25+0.9*R(),bias:R()-0.5,brick:floors<=6&&R()<0.4},o);
  for(let i=-5;i<5;i++)for(let j=-5;j<5;j++){
    const cx=(i+.5)*P,cz=(j+.5)*P,inner=i>=-3&&i<3&&j>=-3&&j<3,seed=1000+(i+9)*37+(j+9)*101,R=mulberry(seed);
    if((i===-1||i===0)&&j===-4){parks.push({cx,cz,n:4,seed});continue}
    if(i===-1&&j===-2){specs.push(mkSpec(cx-1,cz,20,22,17,seed,R,{intact:false,topF:1.02,slope:0.5,bias:-0.2,ang:2.2,tilt:-0.2,brick:false}));mounds.push({x:cx+12,z:cz+4,r:11,h:2.6,seed,n:60});continue}
    if(i===-1&&j===1){specs.push(mkSpec(cx,cz,24,26,5,seed,R,{intact:false,topF:0.95,slope:0.5,bias:-0.1,ang:2.6,brick:true}));continue}
    if(i===0&&j===1){specs.push(mkSpec(cx+1,cz,24,24,9,seed,R,{intact:false,topF:0.9,slope:1.05,bias:0.15,ang:Math.PI*0.92,brick:false}));mounds.push({x:cx-12,z:cz-3,r:10,h:2.8,seed,n:70});continue}
    if(i===1&&j===-1){parks.push({cx,cz,n:5,seed,pylon:true});continue}
    if(!inner){if(R()<0.82)specs.push(mkSpec(cx+(R()-.5)*8,cz+(R()-.5)*8,18+R()*12,18+R()*12,7+(R()*15|0),seed,R,{coarse:true,brick:false}));continue}
    const t=R();
    if(t<0.58){const s=mkSpec(cx+(R()-.5)*4,cz+(R()-.5)*4,18+R()*10,18+R()*10,3+(R()*R()*13|0),seed,R);specs.push(s);
      if(!s.intact)mounds.push({x:s.cx+Math.cos(s.ang)*s.w*.5,z:s.cz+Math.sin(s.ang)*s.d*.5,r:7+R()*5,h:1.2+R()*2,seed,n:45})}
    else if(t<0.8){for(let k=0;k<2;k++){const s=mkSpec(cx+(k?8.5:-8.5),cz+(R()-.5)*4,13,18+R()*9,3+(R()*9|0),seed+k*7,R);specs.push(s);
      if(!s.intact)mounds.push({x:s.cx+Math.cos(s.ang)*s.w*.5,z:s.cz+Math.sin(s.ang)*s.d*.5,r:6+R()*4,h:1+R()*1.6,seed:seed+k,n:30})}}
    else if(t<0.9){mounds.push({x:cx,z:cz,r:17,h:3.6,seed,n:150});lots.push({cx,cz,seed});
      specs.push(mkSpec(cx,cz,22,22,4,seed,R,{intact:false,topF:0.5,slope:0.9,brick:false}))}
    else parks.push({cx,cz,n:7+(R()*5|0),seed});
  }
  mounds.push({x:92,z:1,r:12,h:3,seed:77,n:80});
  function gh(x,z){
    let h=(fbm2(x*.03+3,z*.03+8)-.5)*1.3+(fbm2(x*.19,z*.19)-.5)*.4;
    for(let k=0;k<mounds.length;k++){const m=mounds[k],dx=x-m.x,dz=z-m.z,d2=(dx*dx+dz*dz)/(m.r*m.r);
      if(d2<1){const w=1-d2;h+=m.h*w*w*(.65+.7*vnoise(x*.45+m.seed,z*.45))}}
    return h;
  }

  /* ── 地面 ── */
  {const GN=430,GS=560,cs=GS/GN,hs=new Float32Array((GN+1)*(GN+1));
    for(let j=0;j<=GN;j++)for(let i=0;i<=GN;i++)hs[j*(GN+1)+i]=gh(-GS/2+i*cs,-GS/2+j*cs);
    const base=nv;
    for(let j=0;j<=GN;j++)for(let i=0;i<=GN;i++){
      const il=Math.max(i-1,0),ir=Math.min(i+1,GN),jl=Math.max(j-1,0),jr=Math.min(j+1,GN);
      let nx=(hs[j*(GN+1)+il]-hs[j*(GN+1)+ir])/((ir-il)*cs),nz=(hs[jl*(GN+1)+i]-hs[jr*(GN+1)+i])/((jr-jl)*cs),ny=1;
      const l=Math.hypot(nx,ny,nz);const o=nv*5,ob=nv*STRIDE;
      f32[o]=-GS/2+i*cs;f32[o+1]=hs[j*(GN+1)+i];f32[o+2]=-GS/2+j*cs;
      i8[ob+12]=Math.round(nx/l*127);i8[ob+13]=Math.round(ny/l*127);i8[ob+14]=Math.round(nz/l*127);i8[ob+15]=1;
      u8[ob+16]=u8[ob+17]=u8[ob+18]=200;u8[ob+19]=0;nv++}
    for(let j=0;j<GN;j++)for(let i=0;i<GN;i++){const a=base+j*(GN+1)+i,b=a+GN+1,c=b+1,d=a+1;
      idx[ni++]=a;idx[ni++]=b;idx[ni++]=c;idx[ni++]=a;idx[ni++]=c;idx[ni++]=d}
  }

  /* ── 部品 ── */
  function rebar(x,y,z,R,n=3){const m=cm,r=cr,g=cg,b=cb,a=ca;M(2,70,42,30,0);
    for(let k=0;k<n;k++){const ox=(R()-.5)*.4,oz=(R()-.5)*.4,l=.5+R()*1.1,lx=(R()-.5)*.5,lz=(R()-.5)*.5;
      beam(x+ox,y-.1,z+oz,x+ox+lx*.4,y+l*.6,z+oz+lz*.4,.035,.035);
      beam(x+ox+lx*.4,y+l*.6,z+oz+lz*.4,x+ox+lx*1.6,y+l*(.7+R()*.4),z+oz+lz*1.6,.035,.03)}
    M(m,r,g,b,a)}
  function rubble(m){const R=mulberry(m.seed*31+5);
    for(let k=0;k<m.n;k++){const a=R()*TAU,rr=m.r*Math.sqrt(R())*.95,x=m.x+Math.cos(a)*rr,z=m.z+Math.sin(a)*rr,y=gh(x,z)+R()*.35-.12,t=R(),s=150+R()*40;
      M(0,s,s,s+4,R()*255|0);
      if(t<.5)box(x,y,z,.6+R()*1.5,.12+R()*.1,.5+R()*1.1,(R()-.5)*1.1,R()*TAU,(R()-.5)*1.1);
      else if(t<.8)box(x,y,z,.3+R()*.6,.25+R()*.5,.3+R()*.6,R()*3,R()*3,R()*3);
      else{box(x,y+.3,z,.18,.18,1+R()*1.6,(R()-.5)*1.4,R()*TAU,0);if(R()<.5)rebar(x,y+.3,z,R,2)}}
  }
  function building(s){
    const R=mulberry(s.seed*7919+13),coarse=!!s.coarse,w=s.w,d=s.d,fl=s.floors,fh=coarse?3.7:3.3,H=fl*fh,bay=coarse?5.6:3.3;
    const nx=Math.max(2,Math.round(w/bay)),nz=Math.max(2,Math.round(d/bay)),bw=w/nx,bd=d/nz,cx=s.cx,cz=s.cz,th=.35;
    const y0=gh(cx,cz)-.5,yb=y0+.5,dx=Math.cos(s.ang),dz=Math.sin(s.ang),hd=Math.hypot(w,d)/2,top=H*s.topF,ns=s.seed*1.37%97;
    const hc=(x,z)=>s.intact?H+9:Math.max(fh*.5,top-Math.max(0,(x*dx+z*dz)/hd+s.bias)*H*s.slope+(fbm2(x*.13+ns,z*.13+ns*.7)-.47)*H*.45);
    const bl=[],nb=coarse?0:(R()*3|0)+(s.intact?1:0);
    for(let k=0;k<nb;k++){const a=R()*TAU;bl.push(Math.cos(a)*w*.55,(.2+.7*R())*H,Math.sin(a)*d*.55,3+R()*4.5)}
    const blasted=(x,y,z)=>{for(let k=0;k<bl.length;k+=4){const ex=x-bl[k],ey=y-bl[k+1],ez=z-bl[k+2];if(ex*ex+ey*ey+ez*ez<bl[k+3]*bl[k+3])return true}return false};
    if(s.tilt)setRot(cx+w/2,y0,cz,0,0,1,s.tilt);
    const tv=R(),tr=s.brick?140+tv*40:150+tv*45,tg=s.brick?78+tv*22:150+tv*42,tb=s.brick?62+tv*16:152+tv*40,sa=R()*255|0;
    const CM=()=>M(s.brick?5:0,tr,tg,tb,sa);
    CM();box(cx,y0-2.5,cz,w/2+th,3,d/2+th);
    const wall=(side,a0,a1,ya,yt)=>{const c=(a0+a1)/2,h=(a1-a0)/2,my=yb+(ya+yt)/2,hy=(yt-ya)/2;if(hy<=0||h<=0)return;
      if(side<2)box(cx+c,my,cz+(side?1:-1)*(d/2+th/2),h,hy,th/2);else box(cx+(side===3?1:-1)*(w/2+th/2),my,cz+c,th/2,hy,h)};
    // 柱
    if(!coarse)for(let ix=0;ix<=nx;ix++)for(let iz=0;iz<=nz;iz++){
      const edge=ix===0||ix===nx||iz===0||iz===nz;if(!edge&&((ix+iz)&1))continue;
      const x=-w/2+ix*bw,z=-d/2+iz*bd,h=Math.min(H,hc(x,z)+(R()-.5)*1.6);if(h<.6)continue;
      const ox=ix===0?-th/2:ix===nx?th/2:0,oz=iz===0?-th/2:iz===nz?th/2:0;
      box(cx+x+ox,yb+h/2,cz+z+oz,.3,h/2,.3);
      if(h<H-.2&&R()<.6)rebar(cx+x+ox,yb+h,cz+z+oz,R);
    }
    // 床
    for(let f=1;f<=fl;f++){const y=f*fh;for(let iz=0;iz<nz;iz++){const z=-d/2+(iz+.5)*bd;let run=-1;
      for(let ix=0;ix<=nx;ix++){let alive=false;
        if(ix<nx){const x=-w/2+(ix+.5)*bw,h=hc(x,z);alive=h>y+.2&&!blasted(x,y,z)&&(coarse||h2(s.seed+ix*7+f*131,iz*13+f)>.05);
          if(!alive&&!coarse&&h>y-fh*.8&&R()<.16)box(cx+x,yb+y-fh*(.3+.3*R()),cz+z,bw*.5,.14,bd*.5,(R()-.5)*1.7,0,(R()-.5)*1.7)}
        if(alive&&run<0)run=ix;
        if(!alive&&run>=0){const x0=-w/2+run*bw,x1=-w/2+ix*bw;box(cx+(x0+x1)/2,yb+y-.15,cz+z,(x1-x0)/2,.15,bd/2);run=-1}
      }}}
    // 外壁
    for(let side=0;side<4;side++){const n=side<2?nx:nz,b=side<2?bw:bd,half=side<2?w/2:d/2;
      const at=a=>side<2?hc(a,side?d/2:-d/2):hc(side===3?w/2:-w/2,a);

  let uv = sp.xy * vec2f(0.5, -0.5) + 0.5;
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0 || sp.z > 1.0) { return 1.0; }
  let t = vec2f(1.6 / 4096.0, 1.6 / 2048.0);
  var s = 0.0;
  for (var j = -1; j <= 1; j++) { for (var i = -1; i <= 1; i++) {
    s += textureSampleCompareLevel(shadowT, cmpS, uv + vec2f(f32(i), f32(j)) * t, sp.z);
  } }
  return s / 9.0;
}
@fragment fn fs(i: VO) -> @location(0) vec4f {
  let p = i.wp;
  let fwv = fwidth(p.y); let fwh = fwidth(p.x) + fwidth(p.z);
  let m = i.mat;
  if (m == 4u) { return vec4f(fog(i.col.rgb * (1.0 + i.col.a * 40.0), p), 1.0); }
  var n = normalize(i.n);
  let toCam = g.cam.xyz - p; let dist = length(toCam); let V = toCam / dist;
  let L = g.sun.xyz;
  let side = 1.0 - abs(n.y);
  let seed = i.col.a * 37.0;

  let q = p + vec3f(n.x, 0.0, n.z) * 0.45;
  let ex = expo(q + vec3f(0.0, 0.28, 0.0), 0.5);
  let sv = expo(q + vec3f(0.0, 0.7, 0.0), 3.2);

  let n1 = fbm3(p * 0.55 + seed);
  let n2 = noise3(p * 7.0);
  var alb = vec3f(0.5);
  if (m == 0u) {
    alb = i.col.rgb * (0.50 + 0.62 * n1) * (0.88 + 0.24 * n2);
    let st = fbm3(vec3f(p.x * 1.3, p.y * 0.12, p.z * 1.3) + seed);
    alb *= mix(1.0, 0.48, smoothstep(0.48, 0.74, st) * side);
    let ln = (1.0 - smoothstep(0.0, 0.035, abs(fract(p.y * 0.9) - 0.5))) * side * smoothstep(55.0, 18.0, dist);
    alb *= 1.0 - 0.14 * ln;
    alb *= mix(0.38, 1.0, smoothstep(0.26, 0.6, fbm3(p * 0.06 + 7.0)));
    alb *= mix(1.0, 0.6, step(n.y, -0.5));
  } else if (m == 5u) {
    let u = select(p.x, p.z, abs(n.x) > abs(n.z));
    let row = floor(p.y / 0.085);
    let uu = u / 0.26 + 0.5 * (row - 2.0 * floor(row * 0.5));
    let fu = fract(uu); let fv = fract(p.y / 0.085);
    let fw = max(fwv / 0.085, fwh / 0.26);
    let mort = 1.0 - smoothstep(0.02, 0.10 + fw, min(min(fu, 1.0 - fu) * 3.0, min(fv, 1.0 - fv)));
    let fade = clamp(1.0 - fw * 1.3, 0.0, 1.0) * side;
    let bc = i.col.rgb * (0.66 + 0.6 * hash13(vec3f(floor(uu), row, 3.0)));
    alb = mix(i.col.rgb * 0.93, mix(bc, vec3f(0.40, 0.385, 0.37), mort), fade) * (0.55 + 0.6 * n1);
    alb *= mix(0.42, 1.0, smoothstep(0.26, 0.6, fbm3(p * 0.06 + 7.0)));
  } else if (m == 1u) {
    alb = vec3f(0.125, 0.115, 0.105) * (0.55 + 0.9 * n1);
  } else if (m == 2u) {
    alb = mix(i.col.rgb, vec3f(0.30, 0.15, 0.075), smoothstep(0.32, 0.66, fbm3(p * 1.7 + seed))) * (0.45 + 0.7 * n2);
  } else {
    alb = i.col.rgb * (0.5 + 0.9 * noise3(p * vec3f(9.0, 1.4, 9.0)));
  }

  // 雪の積もり方
  let sn = fbm3(p * 1.1 + 3.0);
  var snow = 0.0;
  if (m == 1u) {
    snow = smoothstep(0.12, 0.55, ex + (sn - 0.5) * 0.5);
  } else {
    snow = smoothstep(0.28, 0.66, n.y + (sn - 0.5) * 0.6) * smoothstep(0.15, 0.55, ex + (sn - 0.5) * 0.3);
    let cling = smoothstep(0.50, 0.72, fbm3(p * vec3f(0.55, 0.33, 0.55) + 11.0)) * smoothstep(-0.3, 0.6, n.x * 0.83 + n.z * 0.55);
    snow = max(snow, cling * side * ex * 0.85);
  }
  if (snow > 0.01) {
    let e = 0.35;
    let dn = vec3f(fbm3(p * 1.6 + vec3f(e, 0.0, 0.0)) - fbm3(p * 1.6 - vec3f(e, 0.0, 0.0)), 0.0, fbm3(p * 1.6 + vec3f(0.0, 0.0, e)) - fbm3(p * 1.6 - vec3f(0.0, 0.0, e)));
    n = normalize(n - dn * 0.55 * snow * smoothstep(70.0, 20.0, dist));
  }
  alb = mix(alb, SNOWALB, snow);

  // 光
  let sh = sunShadow(p, n);
  let ndl = dot(n, L);
  let dif = mix(max(ndl, 0.0), clamp(ndl * 0.72 + 0.28, 0.0, 1.0), snow);
  let amb = mix(vec3f(0.070, 0.074, 0.088), vec3f(0.155, 0.205, 0.31), n.y * 0.5 + 0.5) * mix(0.16, 1.0, sv);
  var col = alb * (SUNCOL * 2.3 * dif * sh + amb);
  col += alb * pointLights(p, n, 0.3);

  // 雪面のきらめき
  if (snow > 0.5 && dist < 16.0) {
    let c = floor(p * 60.0);
    let hn = normalize(n + (vec3f(hash13(c + 1.3), hash13(c + 2.7), hash13(c + 4.1)) - 0.5) * 1.3);
    let sp = pow(max(dot(reflect(-V, hn), L), 0.0), 36.0) * step(0.90, hash13(c));
    col += SUNCOL * sp * sh * 7.0 * smoothstep(16.0, 6.0, dist) * snow;
  }
  return vec4f(fog(col, p), 1.0);
}

struct M4 { m: mat4x4f }
@group(1) @binding(0) var<uniform> dm: M4;
@vertex fn vsDepth(@location(0) p: vec3f) -> @builtin(position) vec4f { return dm.m * vec4f(p, 1.0); }

// 空
struct SK { @builtin(position) pos: vec4f, @location(0) ndc: vec2f }
@vertex fn vsSky(@builtin(vertex_index) vi: u32) -> SK {
  var o: SK; let q = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u)) * 2.0 - 1.0; o.pos = vec4f(q, 1.0, 1.0); o.ndc = q; return o;
}
@fragment fn fsSky(i: SK) -> @location(0) vec4f {

// 灯りのにじみと炎
struct GO { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) col: vec3f, @location(2) @interpolate(flat) kind: f32, @location(3) size: f32 }
@vertex fn vsGlow(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> GO {
  var quad = array<vec2f, 6>(vec2f(-1, -1), vec2f(1, -1), vec2f(1, 1), vec2f(-1, -1), vec2f(1, 1), vec2f(-1, 1));
  let c = quad[vi]; let l = g.lights[ii];
  let size = select(4.2, 2.6, l.col.a > 1.5);
  let wp = l.pos.xyz + (g.right.xyz * c.x + g.up.xyz * c.y) * size;
  var o: GO; o.pos = g.vp * vec4f(wp, 1.0); o.uv = c; o.col = l.col.rgb * (1.0 - fogAmt(l.pos.xyz)); o.kind = l.col.a; o.size = size;
  if (l.pos.w < 0.5) { o.pos = vec4f(2.0, 2.0, 2.0, 1.0); }
  return o;
}
@fragment fn fsGlow(i: GO) -> @location(0) vec4f {
  let r2 = dot(i.uv, i.uv);
  var c = i.col * (exp(-r2 * 7.0) * 0.022 + exp(-r2 * 90.0) * 0.10) * smoothstep(1.0, 0.6, r2);
  if (i.kind < 1.5) {
    let mm = i.uv * i.size;
    let qq = vec2f(mm.x / 0.34, (mm.y + 0.55) / 1.25);
    if (qq.y > 0.0 && qq.y < 1.0 && abs(qq.x) < 1.6) {
      let t = g.cam.w;
      let shape = (1.0 - qq.y) * smoothstep(1.0, 0.1, abs(qq.x + (noise2(vec2f(qq.y * 3.0 - t * 2.4, i.col.r * 3.0)) - 0.5) * 0.7 * qq.y) * (1.0 + qq.y * 1.8));

      let fl = smoothstep(0.30, 0.85, shape * (0.55 + 1.5 * nz));
      c += mix(vec3f(2.4, 0.5, 0.06), vec3f(3.6, 2.0, 0.6), smoothstep(0.3, 0.9, fl * (1.0 - qq.y))) * fl * (1.0 - fogAmt(g.cam.xyz + normalize(vec3f(1.0)) * 0.0));
    }
  }
  return vec4f(c, 0.0);
}

// 雪片
struct SO { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) col: vec4f }
@vertex fn vsSnow(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> SO {
  var quad = array<vec2f, 6>(vec2f(-1, -1), vec2f(1, -1), vec2f(1, 1), vec2f(-1, -1), vec2f(1, 1), vec2f(-1, 1));

  let d = length(rel);

  var a = step(th - 0.1, wp.y) * smoothstep(0.3, 1.0, d) * smoothstep(23.0, 15.0, length(rel.xz)) * smoothstep(17.0, 12.0, abs(rel.y));

  let rd = rel / max(d, 1e-3);

  var o: SO; o.pos = g.vp * vec4f(pos, 1.0); o.uv = c; o.col = vec4f(col * a, a) * 0.9;

  return o;
}
@fragment fn fsSnow(i: SO) -> @location(0) vec4f {
  return i.col * smoothstep(1.0, 0.25, length(i.uv));
}
`;

const WGSL_POST = /* wgsl */`
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var smp: sampler;
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f }
@vertex fn vs(@builtin(vertex_index) vi: u32) -> VO {
  var o: VO; let q = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u)); o.pos = vec4f(q * 2.0 - 1.0, 0.0, 1.0); o.uv = vec2f(q.x, 1.0 - q.y); return o;
}
fn tap(uv: vec2f) -> vec3f { return textureSampleLevel(src, smp, uv, 0.0).rgb; }
fn down(uv: vec2f) -> vec3f {
  let t = 1.0 / vec2f(textureDimensions(src));
  return tap(uv) * 0.5 + (tap(uv + t * vec2f(-1, -1)) + tap(uv + t * vec2f(1, -1)) + tap(uv + t * vec2f(-1, 1)) + tap(uv + t * vec2f(1, 1))) * 0.125;
}
@fragment fn fsPre(i: VO) -> @location(0) vec4f {
  let c = min(down(i.uv), vec3f(24.0));
  let l = dot(c, vec3f(0.3, 0.55, 0.15));
  return vec4f(c * (0.035 + smoothstep(0.55, 1.8, l)), 1.0);
}
@fragment fn fsDown(i: VO) -> @location(0) vec4f { return vec4f(down(i.uv), 1.0); }
@fragment fn fsUp(i: VO) -> @location(0) vec4f {
  let t = 1.0 / vec2f(textureDimensions(src));
  let c = (tap(i.uv + t * vec2f(-1, -1)) + tap(i.uv + t * vec2f(1, -1)) + tap(i.uv + t * vec2f(-1, 1)) + tap(i.uv + t * vec2f(1, 1))) * (1.0 / 6.0)
        + (tap(i.uv + t * vec2f(-2, 0)) + tap(i.uv + t * vec2f(2, 0)) + tap(i.uv + t * vec2f(0, -2)) + tap(i.uv + t * vec2f(0, 2))) * (1.0 / 12.0);
  return vec4f(c, 1.0);
}
@group(0) @binding(2) var bloomT: texture_2d<f32>;
struct PP { v: vec4f }
@group(0) @binding(3) var<uniform> pp: PP;
fn h12(p: vec2f) -> f32 { var q = fract(vec3f(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }

  var c = textureSampleLevel(src, smp, i.uv, 0.0).rgb + textureSampleLevel(bloomT, smp, i.uv, 0.0).rgb * 0.30;
  c *= pp.v.y;

  c += gr * (0.030 * (1.0 - 0.6 * dot(c, vec3f(0.333)))) + (h12(px * 1.7 + 11.0) - 0.5) / 255.0;
  return vec4f(c, 1.0);
}
`;
